name: Update Doorman state tracker data

on:
  schedule:
    # 11:00 UTC daily (~6-7am US Eastern). Edit this line to change cadence.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas html5lib

      - name: Run scraper
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python scraper.py

      - name: Commit updated data if changed
        run: |
          git config user.name "doorman-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update: $(date -u +%Y-%m-%d)"
          git push
