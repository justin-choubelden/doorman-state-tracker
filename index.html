<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doorman State Regulation Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-side">
    <div class="navlinks">
      <a href="index.html" class="active">National Landscape</a>
      <a href="states.html">State-by-State Data</a>
      <a href="target-states.html">Target States</a>
      <a href="how-it-works.html">How It Works</a>
    </div>
  </div>
  <div class="brand">Doorman State Regulation Tracker</div>
  <div class="header-side right">
    <span class="badge" id="lastUpdated">Loading...</span>
  </div>
</header>

<main>
  <div class="page-grid">
    <div class="main-col">

      <section class="map-section">
        <div class="controls">
          <div class="search-wrap">
            <input type="text" id="search" placeholder="Search state..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <svg id="map" viewBox="0 0 975 610"></svg>
        <div class="empty-state" id="mapError" style="display:none"></div>
      </section>
    </div>

    <aside class="snapshot-sidebar">
      <h2>Snapshot</h2>
      <div id="snapshotStats" class="placeholder"></div>
    </aside>
  </div>
</main>

<script src="shared.js"></script>
<script>
function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  Object.keys(CATEGORIES).forEach(cat => {
    const el = document.createElement('span');
    el.className = 'legend-item';
    el.innerHTML = `<i class="dot" style="background:${CATEGORIES[cat].color}"></i>${cat}`;
    el.addEventListener('mouseenter', (e) => showLegendTooltip(cat, e.clientX, e.clientY));
    el.addEventListener('mousemove', (e) => positionTooltip(e.clientX, e.clientY));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', (e) => showLegendTooltip(cat, e.clientX, e.clientY));
    legend.appendChild(el);
  });
}

function showLegendTooltip(cat, x, y) {
  ensureTooltipMarkup();
  const tip = document.getElementById('stateTooltip');
  tip.innerHTML = `<div class="tt-name">${cat}</div><div class="tt-desc">${CATEGORIES[cat].desc}</div>`;
  tip.style.display = 'block';
  positionTooltip(x, y);
}

function renderSnapshot() {
  const counts = {};
  Object.keys(CATEGORIES).forEach(c => counts[c] = 0);
  DATA.forEach(d => { if (counts[d.DoormanCompatibility] !== undefined) counts[d.DoormanCompatibility]++; });
  document.getElementById('snapshotStats').innerHTML = Object.keys(CATEGORIES).map(cat => `
    <div class="field">
      <div class="k"><i class="dot" style="background:${CATEGORIES[cat].color}"></i>${cat}</div>
      <div class="v">${counts[cat]} states</div>
    </div>
  `).join('');
}

async function initMap() {
  renderLegend();
  await initData();
  renderSnapshot();
  wireSearchAutocomplete();

  const svg = d3.select('#map');
  const errorBox = document.getElementById('mapError');
  const WIDTH = 975, HEIGHT = 610;

  try {
    let us;
    try {
      us = await d3.json("./us-states-10m.json");
      if (!us) throw new Error("local file returned empty");
    } catch (localErr) {
      console.warn("Local us-states-10m.json failed, falling back to CDN:", localErr);
      us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
    }
    if (!us || !us.objects || !us.objects.states) {
      throw new Error('Unexpected topology structure (missing objects.states)');
    }
    const states = topojson.feature(us, us.objects.states);

    // Critical: states-10m.json ships raw lon/lat coordinates, not
    // pre-projected pixels - a bare d3.geoPath() with no projection was
    // the actual cause of the map appearing blank (it rendered a
    // microscopic sliver in the corner of the viewBox). fitSize()
    // computes the right scale/translate to fill the given box.
    const projection = d3.geoAlbersUsa().fitSize([WIDTH, HEIGHT], states);
    const path = d3.geoPath(projection);

    svg.selectAll('path')
      .data(states.features)
      .join('path')
      .attr('class', 'state')
      .attr('data-name', d => d.properties.name)
      .attr('d', path)
      .attr('fill', d => {
        const rec = byState[d.properties.name];
        return rec ? colorFor(rec.DoormanCompatibility) : "#3a4258";
      })
      .on('mouseenter', function(e, d) {
        d3.select(this).attr('stroke', '#fff').attr('stroke-width', 1.6);
        showTooltip(d.properties.name, e.clientX, e.clientY);
      })
      .on('mousemove', (e) => positionTooltip(e.clientX, e.clientY))
      .on('mouseleave', function() {
        d3.select(this).attr('stroke', null).attr('stroke-width', null);
        hideTooltip();
      })
      .on('click', (e, d) => openModal(d.properties.name));

    console.log('Map rendered:', states.features.length, 'features');
  } catch (err) {
    console.error('Map failed to render:', err);
    errorBox.style.display = '';
    errorBox.textContent = 'The map failed to load (' + err.message + '). Try a hard refresh (Cmd+Shift+R). If it still fails, open the browser console (F12) and send the error text.';
  }
}
initMap();
</script>
</body>
</html>
